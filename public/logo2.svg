<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFC6" />
      <stop offset="100%" stop-color="#0088FF" />
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background -->
  <rect width="512" height="512" rx="100" fill="#0A0E17" />

  <!-- Fluid 'F' Shape -->
  <g filter="url(#soft-glow)">
    <!-- Vertical Spine -->
    <rect x="140" y="120" width="36" height="272" rx="18" fill="url(#neon-grad)" />
    
    <!-- Top Flux Wave (Top arm of F) -->
    <path d="M 140 138 C 220 138, 260 90, 340 110 C 370 118, 380 148, 340 158 C 260 180, 220 174, 140 174 Z" fill="url(#neon-grad)" />
    
    <!-- Middle Code Flow (Middle arm of F + > arrow) -->
    <path d="M 140 240 C 210 240, 250 210, 290 240 L 320 260 L 290 280 C 250 310, 210 276, 140 276 Z" fill="url(#neon-grad)" opacity="0.85" />
  </g>

  <!-- Terminal Cursor Accent -->
  <rect x="330" y="360" width="48" height="12" rx="6" fill="#00FFC6">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
  </rect>
</svg>
