          fill="none" 
          stroke="url(#purple-flux)" 
          stroke-width="24" />

    <!-- Sharp Bracket Right > -->
    <path d="M 342 200 L 402 256 L 342 312" 
          fill="none" 
          stroke="url(#purple-flux)" 
          stroke-width="24" />

